function makeDeps(state) {
  const cacheStore = {};

    config: GATEWAY_CONFIG,
    verifyToken: (t) => { if (!TOKENS[t]) throw new GatewayError_(401, "bad token"); return TOKENS[t]; },
    cache: { get: (k) => cacheStore[k] || null, put: (k, v) => { cacheStore[k] = v; }, remove: (k) => { delete cacheStore[k]; } },
    lock: (fn) => fn(),
    now: () => Date.now(),
    requests: {

    },
    mail: { send: (m) => { if (state.__mailFail) throw new Error("mail down"); state.__mail.push(m); } },
    quotaEmail: {
      getUltimoAlerta: () => state.__quotaAlerta || null,
      setUltimoAlerta: (d) => { state.__quotaAlerta = d; },
    },
    registry: {
      list: () => state.__registry.filter((e) => e.ativa !== false).map((e) => Object.assign({}, e)),
      listAll: () => state.__registry.map((e) => Object.assign({}, e)),
      add: (e) => { state.__registry.push({ spreadsheetId: e.spreadsheetId, empresa: e.empresa, sheetName: "Lançamento", segmento: e.segmento, ativa: true }); },
      setActive: (spreadsheetId, ativa) => {
        const e = state.__registry.filter((x) => x.spreadsheetId === spreadsheetId)[0];
        if (!e) return false;
        e.ativa = ativa;
        return true;
      },
    },
    sheets: {
      getTitles: (id) => Object.keys(state[id]),
      getValues: (id, range) => { const tab = range.split("!")[0].replace(/^'|'$/g, ""); if (!state[id] || !state[id][tab]) throw new Error("Unable to parse range: " + range); return state[id][tab].slice(1); },
      updateValues: (id, range, values) => {
        state[id].__log = (state[id].__log || []).concat([[range, values]]);
        const mc = /^Configuração!A(\d+):[BC]\d+$/.exec(range);
        if (mc) { state[id]["Configuração"] = state[id]["Configuração"] || [["Papel", "Aba"]]; state[id]["Configuração"][Number(mc[1]) - 1] = values[0]; }
        const m = /^Usuários!A(\d+):C\d+$/.exec(range);

        return id;
      },
      addTab: (id, title) => { state[id][title] = [["Email","Nome","Perfil"]]; },
    },
  };
}

function run(name, who, body, expect) {

}
function runOn(name, who, body, expect, state) {
  const deps = makeDeps(state);

  run(`nobody cannot read ${tab}`, "nobody", u({ action: "getValues", range: `'${tab}'!A2:J` }), 403);
  // creating the tab itself (not just a row in it) is Master-only, even
  // though an Editor may write rows once it exists — same as Usuários/Configuração.
  run(`edi cannot create the ${tab} tab`, "edi", u({ action: "addTab", title: tab }), 403);
  run(`mas can create the ${tab} tab`, "mas", u({ action: "addTab", title: tab }), "ok");
});
run("a company's Fornecedores stays isolated from another company's", "mas", { action: "getValues", spreadsheetId: CAR, range: "Fornecedores!A2:J" }, 403);
run("hostile text in a Fornecedores cell is still just a scalar string write (RAW, never a formula)", "edi", u({ action: "updateValues", range: "Fornecedores!A5:A5", values: row(["=HYPERLINK(\"http://evil\")"]) }), "ok");
run("a Contas a Pagar row rejects a non-scalar cell (same validateRow_ as every tab)", "edi", u({ action: "updateValues", range: "'Contas a Pagar'!A5:A5", values: row([{ f: "=1" }]) }), 400);
run("addTab still refuses an arbitrary title, ERP or not", "mas", u({ action: "addTab", title: "Salários" }), 403);

// --- ERP, Fase 1: avisos de vencimento (verificarLembretes) ----------------

(function () {
  function contasState(pagarRows, receberRows) {
    const state = freshState();
    state[IPA]["Contas a Pagar"] = [["Descrição", "Fornecedor", "Categoria", "Valor", "Vencimento", "Status", "Pago em", "Recorrente", "Observação", "Avisado em"]].concat(pagarRows || []);
    state[IPA]["Contas a Receber"] = [["Descrição", "Cliente", "Categoria", "Valor", "Vencimento", "Status", "Recebido em", "Recorrente", "Observação", "Avisado em"]].concat(receberRows || []);
    return state;
  }
  const HOJE = Math.floor((Date.now() - Date.UTC(1899, 11, 30)) / 86400000);

  // viz cannot trigger the check (would spend mail quota on something a Visualizador has no business sending)
  {
    const state = contasState([["Aluguel", "Dono do ponto", "Despesas fixas", 1200, HOJE - 1, "Pendente", "", "Não", "", ""]], []);
    const r = runOn("viz cannot trigger verificarLembretes", "viz", u({ action: "verificarLembretes" }), 403, state);
    results.push((state.__mail.length === 0 ? "PASS" : "FAIL") + " ...and no mail was sent trying");
  }

  // edi can trigger it; an overdue Pendente conta mails every Editor+Master, never the Visualizador
  {
    const state = contasState([["Aluguel", "Dono do ponto", "Despesas fixas", 1200, HOJE - 1, "Pendente", "", "Não", "", ""]], []);
    const r = runOn("edi triggers verificarLembretes with one overdue conta", "edi", u({ action: "verificarLembretes" }), "ok", state);
    results.push((r.payload && r.payload.avisados === 1 ? "PASS" : "FAIL") + " it reports exactly one conta notified");
    const recipients = state.__mail.map((m) => m.to);
    results.push((recipients.indexOf("edi@x.com") !== -1 && recipients.indexOf("mas@x.com") !== -1 ? "PASS" : "FAIL") + " both Editor and Master were e-mailed");
    results.push((recipients.indexOf("viz@x.com") === -1 ? "PASS" : "FAIL") + " the Visualizador was not e-mailed");
    results.push((state.__mail[0] && /ATRASADA/.test(state.__mail[0].body) ? "PASS" : "FAIL") + " the overdue item is flagged ATRASADA in the e-mail body");
  }

  // a conta already marked Avisado em = hoje is not re-mailed (dedup)
  {
    const state = contasState([["Aluguel", "Dono do ponto", "Despesas fixas", 1200, HOJE - 1, "Pendente", "", "Não", "", HOJE]], []);
    const r = runOn("a conta already notified today is skipped", "edi", u({ action: "verificarLembretes" }), "ok", state);
    results.push((r.payload && r.payload.avisados === 0 && state.__mail.length === 0 ? "PASS" : "FAIL") + " ...no mail, avisados: 0");
  }

  // a Pago conta, however overdue its Vencimento, is never a reminder candidate
  {
    const state = contasState([["Aluguel", "Dono do ponto", "Despesas fixas", 1200, HOJE - 30, "Pago", HOJE - 1, "Não", "", ""]], []);
    const r = runOn("a conta already Pago is never reminded about", "edi", u({ action: "verificarLembretes" }), "ok", state);
    results.push((r.payload && r.payload.avisados === 0 && state.__mail.length === 0 ? "PASS" : "FAIL") + " ...no mail, avisados: 0");
  }

  // a conta due far in the future (beyond the 3-day window) is not a candidate yet
  {
    const state = contasState([["Aluguel", "Dono do ponto", "Despesas fixas", 1200, HOJE + 30, "Pendente", "", "Não", "", ""]], []);
    const r = runOn("a conta due in 30 days is outside the reminder window", "edi", u({ action: "verificarLembretes" }), "ok", state);
    results.push((r.payload && r.payload.avisados === 0 ? "PASS" : "FAIL") + " ...avisados: 0");
  }

  // the check is scoped to the one company it was called for — it never reads or mails about another company's contas
  {
    const state = contasState([["Aluguel", "Dono do ponto", "Despesas fixas", 1200, HOJE - 1, "Pendente", "", "Não", "", ""]], []);
    state[CAR] = { "Lançamento": [[]], Estoque: [[]], Usuários: [["Email","Nome","Perfil"], ["edi@x.com","Edi","Editor"]] };
    const deps = makeDeps(state);
    handleRequest({ token: "edi", action: "verificarLembretes", spreadsheetId: CAR }, deps); // the other company, no contas tabs at all there
    results.push((state.__mail.length === 0 ? "PASS" : "FAIL") + " a company with no Contas tabs yet is simply a no-op, not a crash");
  }

  // Contas a Receber feeds the same digest, with its own "Recebido" status word
  {
    const state = contasState([], [["Venda a prazo", "Cliente VIP", "Vendas", 800, HOJE, "Pendente", "", "Não", "", ""]]);
    const r = runOn("Contas a Receber due today is also picked up", "mas", u({ action: "verificarLembretes" }), "ok", state);
    results.push((r.payload && r.payload.avisados === 1 && state.__mail[0] && /A RECEBER/.test(state.__mail[0].body) ? "PASS" : "FAIL") + " ...reported and labelled A RECEBER in the e-mail");
  }

  // executarVerificacaoLembretes_ is the shared core the daily trigger uses
  // (verificarLembretesTodasEmpresasAgendado) — no "access"/role object at
  // all, since there is no caller to gate when the script itself runs it.
  {
    const state = contasState([["Contador", "Fulano", "Despesas fixas", 500, HOJE, "Pendente", "", "Sim", "", ""]], []);
    const deps = makeDeps(state);
    const resultado = executarVerificacaoLembretes_(deps, IPA, "Ipanema Joias");
    // IPA's Usuários (freshState) has three Editor/Master rows: edi, mas, and the admin (also Master there) — one e-mail each.
    results.push((resultado.avisados === 1 && state.__mail.length === 3 ? "PASS" : "FAIL") + " executarVerificacaoLembretes_ works with no access/role object (the trigger has no caller)");
  }

  // The scheduled trigger loops every known company the same way companyMap_
  // already does for "me" — one failing company must not stop the others.
  {
    const state = contasState([["Contador", "Fulano", "Despesas fixas", 500, HOJE, "Pendente", "", "Sim", "", ""]], []);
    state[CAR] = { "Lançamento": [[]], Estoque: [[]], Usuários: [["Email", "Nome", "Perfil"], ["edi@x.com", "Edi", "Editor"]] };
    const deps = makeDeps(state);
    const empresas = companyMap_(deps);
    let total = 0;
    let falhas = 0;
    Object.keys(empresas).forEach((id) => {
      try {
        total += executarVerificacaoLembretes_(deps, id, empresas[id].empresa).avisados;
      } catch (err) {
        falhas += 1;
      }
    });
    results.push((total === 1 && falhas === 0 ? "PASS" : "FAIL") + " looping every company (as the daily trigger does) mails Ipanema's conta and is a no-op for Carolina (no Contas tabs), with nothing thrown");
  }

  // ---- verificarCotaDeEmail_ (the Mail quota alert, 2026-10-11) ----
  {
    const state = freshState();
    const deps = makeDeps(state);
    const r = verificarCotaDeEmail_(deps, 50); // 50/100 used = 50%, below the 90% threshold
    results.push((r.avisado === false && state.__mail.length === 0 ? "PASS" : "FAIL") + " quota alert: below threshold sends nothing");
  }
  {
    const state = freshState();
    const deps = makeDeps(state);
    const r = verificarCotaDeEmail_(deps, 5); // 95/100 used = 95%, over the 90% threshold
    results.push((r.avisado === true && state.__mail.length === 1 && state.__mail[0].to === ADMIN_EMAIL ? "PASS" : "FAIL") + " quota alert: over threshold mails ADMIN_EMAILS once");
  }
  {
    const state = freshState();
    const deps = makeDeps(state);
    verificarCotaDeEmail_(deps, 5);
    const r2 = verificarCotaDeEmail_(deps, 2); // still over threshold, same (mocked) day
    results.push((r2.avisado === false && state.__mail.length === 1 ? "PASS" : "FAIL") + " quota alert: a second check the same day does not re-mail");
  }
  {
    // Simulates "a new day arrived" by clearing the stored date directly,
    // since makeDeps' now() is the real clock and can't be moved forward
    // mid-test — this still exercises the real comparison in
    // verificarCotaDeEmail_ (stored date !== computed "today").
    const state = freshState();
    const deps = makeDeps(state);
    verificarCotaDeEmail_(deps, 5);
    state.__quotaAlerta = "2000-01-01";
    const r2 = verificarCotaDeEmail_(deps, 2);
    results.push((r2.avisado === true && state.__mail.length === 2 ? "PASS" : "FAIL") + " quota alert: a new day (different stored date) alerts again");
  }
  {
    const state = freshState();
    const deps = makeDeps(state);
    const r = verificarCotaDeEmail_(deps, 10); // exactly 90/100 = 90%, the threshold itself counts as "over"
    results.push((r.avisado === true ? "PASS" : "FAIL") + " quota alert: exactly 90% used counts as crossing the threshold");
  }

  // ---- push notifications (registrarPush) and the push/WhatsApp leg of the
  // ---- reminder check, on top of makeDeps (which has no pushTokens/push/
  // ---- whatsapp of its own — same pattern the password-login tests use).
  function pushDeps(state) {
    state.__push = state.__push || [];
    state.__pushSent = state.__pushSent || [];
    state.__whatsapp = state.__whatsapp || [];
    const deps = makeDeps(state);
    deps.pushTokens = {
      list: () => state.__push.map((p) => Object.assign({}, p)),
      add: (email, tok) => {
        const canon = canonEmail_(email);
        const existente = state.__push.filter((p) => p.token === tok)[0];
        if (existente) { existente.email = canon; return; }
        state.__push.push({ email: canon, token: tok });
      },
      remove: (tok) => { state.__push = state.__push.filter((p) => p.token !== tok); },
    };
    deps.push = {
      enviar: (tok, titulo, corpo) => {
        state.__pushSent.push({ token: tok, titulo: titulo, corpo: corpo });
        return tok === state.__pushTokenMorto ? false : true;
      },
    };
    deps.whatsapp = { enviar: (total, empresa) => { state.__whatsapp.push({ total: total, empresa: empresa }); } };
    return deps;
  }

  // Any authenticated caller — any role, Google or password session — may
  // register their OWN device; it is opt-in convenience, not a permission.
  {
    const state = freshState();
    const deps = pushDeps(state);
    const r = handleRequest({ token: "viz", action: "registrarPush", pushToken: "tok-viz-1" }, deps);
    results.push((r && r.registrado === true && state.__push.length === 1 && state.__push[0].email === "viz@x.com" && state.__push[0].token === "tok-viz-1" ? "PASS" : "FAIL") + " a Visualizador can register their own device for push");
  }
  {
    const state = freshState();
    const deps = pushDeps(state);
    const semToken = (() => { try { handleRequest({ token: "edi", action: "registrarPush", pushToken: "" }, deps); return null; } catch (e) { return e; } })();
    results.push((semToken instanceof GatewayError_ && semToken.status === 400 ? "PASS" : "FAIL") + " an empty push token is refused");
    const longoDemais = (() => { try { handleRequest({ token: "edi", action: "registrarPush", pushToken: "x".repeat(4097) }, deps); return null; } catch (e) { return e; } })();
    results.push((longoDemais instanceof GatewayError_ && longoDemais.status === 400 ? "PASS" : "FAIL") + " an absurdly long push token is refused");
  }
  {
    // handleRequest's OWN auth token also lives in body.token — a body that
    // (wrongly) reused that name for the device token would register the
    // caller's Google token string instead of a real FCM token.
    const state = freshState();
    const deps = pushDeps(state);
    handleRequest({ token: "edi", action: "registrarPush", pushToken: "tok-edi-1" }, deps);
    results.push((state.__push.length === 1 && state.__push[0].token === "tok-edi-1" && state.__push[0].token !== "edi" ? "PASS" : "FAIL") + " the stored token is the device token, never the caller's own auth token");
  }
  {
    // Registering the same device token again just refreshes who owns it
    // (does not create a duplicate row) — covers a device changing hands/accounts.
    const state = freshState();
    const deps = pushDeps(state);
    handleRequest({ token: "edi", action: "registrarPush", pushToken: "tok-partilhado" }, deps);
    handleRequest({ token: "mas", action: "registrarPush", pushToken: "tok-partilhado" }, deps);
    results.push((state.__push.length === 1 && state.__push[0].email === "mas@x.com" ? "PASS" : "FAIL") + " re-registering the same device token re-assigns it instead of duplicating");
  }

  // executarVerificacaoLembretes_ also pushes to every registered device of
  // each Editor/Master it e-mails, and removes a token the push send reports dead.
  {
    const state = contasState([["Contador", "Fulano", "Despesas fixas", 500, HOJE, "Pendente", "", "Sim", "", ""]], []);
    const deps = pushDeps(state);
    deps.pushTokens.add("edi@x.com", "tok-edi-vivo");
    deps.pushTokens.add("mas@x.com", "tok-mas-morto");
    state.__pushTokenMorto = "tok-mas-morto";
    const resultado = executarVerificacaoLembretes_(deps, IPA, "Ipanema Joias");
    results.push((resultado.avisados === 1 ? "PASS" : "FAIL") + " the reminder itself still works exactly as before with push wired in");
    results.push((state.__pushSent.length === 2 ? "PASS" : "FAIL") + " a push was attempted for both registered devices (one per Editor/Master e-mailed)");
    results.push((state.__push.length === 1 && state.__push[0].token === "tok-edi-vivo" ? "PASS" : "FAIL") + " the token the push send reported dead was removed; the live one was kept");
    results.push((state.__whatsapp.length === 1 && state.__whatsapp[0].total === 1 && state.__whatsapp[0].empresa === "Ipanema Joias" ? "PASS" : "FAIL") + " the WhatsApp test contact was also notified, once, with the right total/company");
  }
  {
    // No pending contas = no push, no WhatsApp either (same early return as e-mail).
    const state = contasState([["Aluguel", "Dono do ponto", "Despesas fixas", 1200, HOJE + 30, "Pendente", "", "Não", "", ""]], []);
    const deps = pushDeps(state);
    deps.pushTokens.add("edi@x.com", "tok-edi-2");
    executarVerificacaoLembretes_(deps, IPA, "Ipanema Joias");
    results.push((state.__pushSent.length === 0 && state.__whatsapp.length === 0 ? "PASS" : "FAIL") + " nothing due soon means no push and no WhatsApp are sent, same as no e-mail");
  }
  {
    // A person with no registered device simply gets no push attempt — not an error.
    const state = contasState([["Aluguel", "Dono do ponto", "Despesas fixas", 1200, HOJE - 1, "Pendente", "", "Não", "", ""]], []);
    const deps = pushDeps(state);
    const resultado = executarVerificacaoLembretes_(deps, IPA, "Ipanema Joias");
    results.push((resultado.avisados === 1 && state.__pushSent.length === 0 && state.__whatsapp.length === 1 ? "PASS" : "FAIL") + " nobody has a registered device: e-mail/WhatsApp still go out, push is just skipped");
  }
  {
    // Without deps.pushTokens/deps.push/deps.whatsapp at all (every OTHER test
    // in this whole suite, via the shared makeDeps) the reminder must behave
    // exactly as it did before this feature existed — already re-confirmed by
    // the full suite staying green, but asserted directly here too.
    const state = contasState([["Aluguel", "Dono do ponto", "Despesas fixas", 1200, HOJE - 1, "Pendente", "", "Não", "", ""]], []);
    const deps = makeDeps(state);
    const resultado = executarVerificacaoLembretes_(deps, IPA, "Ipanema Joias");
    results.push((resultado.avisados === 1 && state.__mail.length === 3 ? "PASS" : "FAIL") + " with no push/whatsapp deps at all (old makeDeps), the reminder still works via e-mail alone");
  }
})();

const failed = results.filter((r) => r.indexOf("FAIL") === 0);
document.getElementById("out").textContent = results.join("\n") + "\n\nTOTAL " + results.length + "  FAILED " + failed.length;
</script></body></html>
